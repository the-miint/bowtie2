name: macOS lldb SIGSEGV debug

# Runs the GPL-boundary failing Rust test on macOS aarch64 under lldb and
# prints one comprehensive dump (threads, frames, registers, disassembly,
# memory around the fault, symbol lookups). Single job, one artifact,
# done.
#
# Triggers only on the debug branch or manual dispatch so this job does
# not run on normal PRs.

on:
  push:
    branches:
      - 'debug/macos-lldb-dump'
  workflow_dispatch:

jobs:
  lldb-dump:
    runs-on: macos-latest
    steps:
      - name: Checkout bowtie2 (current branch)
        uses: actions/checkout@v4
        with:
          submodules: true
          path: bowtie2

      - name: Checkout GPL-boundary @ add-bowtie2-align
        uses: actions/checkout@v4
        with:
          repository: the-miint/GPL-boundary
          ref: add-bowtie2-align
          path: gpl-boundary
          # Don't pull submodules — we'll replace ext/bowtie2 with our
          # local checkout below. sortmerna uses an ssh URL that would
          # fail here anyway and we don't need it.
          submodules: false

      - name: Swap in our bowtie2 checkout
        run: |
          set -euxo pipefail
          rm -rf gpl-boundary/ext/bowtie2
          cp -R bowtie2 gpl-boundary/ext/bowtie2
          # The cp includes .git etc; that's fine, build.rs only reads source.
          git -C gpl-boundary/ext/bowtie2 rev-parse HEAD

      - name: Stub unused submodules so build.rs links succeed
        run: |
          set -euxo pipefail
          # fasttree / prodigal / sortmerna are required by build.rs but
          # irrelevant for the bowtie2 test. Clone fasttree and prodigal
          # (public, HTTPS). sortmerna is ssh-only — stub out its build
          # step by commenting it out in build.rs only if needed.
          cd gpl-boundary
          git submodule update --init ext/fasttree ext/prodigal 2>&1 || {
            echo "--- submodule update failed, cloning directly ---"
            rm -rf ext/fasttree ext/prodigal
            git clone --depth 1 --branch v2.3.0-miint https://github.com/the-miint/fasttree.git ext/fasttree
            git clone --depth 1 --branch v2.6.4-miint https://github.com/the-miint/prodigal.git ext/prodigal
          }
          # sortmerna uses SSH; replace the URL and try HTTPS.
          git submodule set-url ext/sortmerna https://github.com/the-miint/sortmerna.git
          git submodule update --init ext/sortmerna 2>&1 || {
            echo "--- sortmerna clone failed — may need build.rs stub ---"
            exit 1
          }

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: brew install rocksdb zlib

      - name: Build + run failing test under lldb
        working-directory: gpl-boundary
        env:
          # bowtie2 compilation: full symbols (build.rs already picks
          # opt_level=0 on macos-aarch64).
          CFLAGS: "-g3 -fno-omit-frame-pointer"
          CXXFLAGS: "-g3 -fno-omit-frame-pointer"
          RUSTFLAGS: "-C debuginfo=2 -C force-frame-pointers=yes"
          # Make cargo run the test binary through our lldb wrapper.
          # This sidesteps the need to know the exact test-binary path
          # or module path — cargo resolves both.
          CARGO_TARGET_AARCH64_APPLE_DARWIN_RUNNER: /tmp/lldb-wrap.sh
        run: |
          set -euxo pipefail

          # Write the runner. cargo invokes it as:
          #   lldb-wrap.sh /path/to/test-bin <arg1> <arg2> ...
          # We launch the binary under lldb with those args and dump
          # every diagnostic we might want on crash or exit.
          cat > /tmp/lldb-wrap.sh <<'WRAP'
          #!/bin/bash
          set -x
          BIN="$1"; shift
          # lldb's `run` takes args after the verb. Pass through.
          # -o commands run pre-launch and are NOT run after the
          # inferior crashes in batch mode; post-crash diagnostics
          # must go in -k (one-line-on-crash) commands, which fire
          # when the target stops and then lldb exits.
          lldb -b \
            -o "settings set target.process.stop-on-exec false" \
            -k "thread list" \
            -k "thread backtrace all" \
            -k "register read" \
            -k "frame select 0" \
            -k "frame variable --show-types --show-globals" \
            -k "disassemble -n 'SStringExpandable<char, 1024, 2, 1024>::operator='" \
            -k "disassemble -p -c 40" \
            -k "frame select 1" \
            -k "frame variable --show-types" \
            -k "frame select 2" \
            -k "frame variable --show-types" \
            -k "frame select 3" \
            -k "frame variable --show-types" \
            -k "frame select 4" \
            -k "frame variable --show-types" \
            -k "image lookup -a 0x10" \
            -k "image lookup --regex --name 'MemoryPatternSource.*nextBatch'" \
            -k "memory read -s 8 -c 8 -fx \$x0" \
            -k "memory read -s 8 -c 8 -fx \$x1" \
            -k "expression -- *(void**)\$x0" \
            -k "expression -- *(void**)\$x1" \
            -o "run $*" \
            -- "$BIN" \
            2>&1 | tee -a /tmp/lldb-output.txt
          # Exit non-zero only if the child crashed — the lldb dump is
          # the payload so we always want the log. cargo uses exit code
          # to decide test pass/fail.
          if grep -qE "stop reason = EXC_BAD_ACCESS|SIGSEGV|signal SIGBUS" /tmp/lldb-output.txt; then
            exit 139
          fi
          exit 0
          WRAP
          chmod +x /tmp/lldb-wrap.sh
          : > /tmp/lldb-output.txt

          # Let cargo find and build the test. Substring match on the
          # leaf name (no --exact, which would need the full module
          # path `tools::bowtie2_align::tests::...`).
          # `--test-threads=1` reproduces the condition from the
          # GPL-boundary reply doc.
          cargo test test_bowtie2_align_single_end_fastq_roundtrip \
            -- --test-threads=1 --nocapture \
            || echo "cargo test exited non-zero (expected on crash)"

          # Copy to a workspace-relative path so upload-artifact finds it.
          cp /tmp/lldb-output.txt gpl-boundary-lldb-output.txt

          # Fail the job only if the dump shows a crash — the report
          # back to GPL-boundary is the log itself.
          if grep -qE "stop reason = EXC_BAD_ACCESS|SIGSEGV|signal SIGBUS" /tmp/lldb-output.txt; then
            echo "::notice::Test crashed as expected — dump captured"
            exit 0
          fi
          echo "::warning::Test did NOT crash — bug did not reproduce"

      - name: Upload lldb output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lldb-output
          path: |
            gpl-boundary/gpl-boundary-lldb-output.txt
            /tmp/lldb-output.txt

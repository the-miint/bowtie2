name: API Tests
on:
  push:
    branches:
      - 'master'
      - 'feature/reentrant-api'
    paths:
      - '**.h'
      - '**.cpp'
      - '**.c'
      - '**/CMakeLists.txt'
      - 'tests/api/**'
  pull_request:
    branches:
      - 'master'
    paths:
      - '**.h'
      - '**.cpp'
      - '**.c'
      - '**/CMakeLists.txt'
      - 'tests/api/**'
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Run all tests
        run: cd build && ctest --output-on-failure --timeout 120

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)
      - name: Run all tests
        run: cd build && ctest --output-on-failure --timeout 120

  sanitizer-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev
      - name: Configure (ASan)
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_ASAN=ON
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Run API tests under ASan
        run: cd build && ctest -R api-test --output-on-failure --timeout 300

  sanitizer-tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev
      - name: Configure (TSan)
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TSAN=ON
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Run API tests under TSan
        env:
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/tsan_suppressions.txt
        run: cd build && ctest -R api-test --output-on-failure --timeout 300
